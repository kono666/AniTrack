# ============================================================
#  AniTrack · nginx 站点配置
#
#  这个文件同时干两件事, 所以它既是「静态站配置」也是「反向代理配置」:
#    1. 托管前端构建产物 (SPA, 需要 try_files 回退)
#    2. /api 与 /actuator/health 反代到 backend:8080
#
#  前后端同域是刻意的: 浏览器的同源策略之下, 同域意味着没有跨域,
#  后端连 CORS 过滤器都不会注册 (见 CorsProperties). 开发环境由 Vite 的
#  server.proxy 扮演同一个角色, 两边行为要一致 —— 不一致的话,
#  「本地好的、线上坏了」会变成最难查的一类问题.
# ============================================================

# 上游后端.
# 名字 backend 是 docker-compose.yml 里的服务名, 由 compose 的内网 DNS 解析.
# 单独把这个镜像跑起来(不在这个 compose 里)时这里会解析失败, nginx 会**拒绝启动**
# 并打印 "host not found in upstream" —— 那是刻意保留的失败方式:
# 起一个所有 /api 都 502 的站, 比起不来更难排查.
upstream anitrack_backend {
    server backend:8080;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 访问日志按「真实客户端 IP」记.
    # 不写这个的话记下来的是 nginx 眼里的对端 —— 在这里就是反向代理自己,
    # 于是日志里每一行都是同一个地址, 按 IP 排查等于没有日志.
    # 后面那条 $remote_addr 的注释解释了为什么这个值是可信的.
    access_log /var/log/nginx/access.log;

    # 不主动把版本号报给外面 (nginx/1.27.0 这种 banner 的主要用途是帮攻击者选漏洞)
    server_tokens off;

    # 没有文件上传功能, 请求体最大 1m 是默认值, 这里显式写出来并收紧到 256k:
    # 显式是因为「默认值」这种东西会随镜像版本变, 而这个站的接口只需要很小的 JSON.
    client_max_body_size 256k;

    # ------------------------------------------------------------
    #  静态资源
    # ------------------------------------------------------------

    # 带内容哈希的资源名 (index-a1b2c3d4.js) 可以放心长期缓存:
    # 内容一变文件名就变, 不存在「缓存了旧版本」的问题.
    #
    # 这里用 expires 而**不是** add_header Cache-Control:
    # nginx 的 add_header 不继承 —— 只要子层(某个 location)里写了一条 add_header,
    # 父层(server)里那几条就全部失效. 而这个文件底部有三条安全响应头是写在
    # server 层的, 于是在某个 location 里补一条 Cache-Control 的代价是
    # 那个路径上的 X-Content-Type-Options 悄悄消失. 这种"改一处、坏三处"的
    # 传递关系不看文档根本想不到, 所以本文件里的 add_header 只在 server 层出现.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # index.html **不能**缓存.
    # 它是唯一一个「名字不变、内容会变」的文件, 而它里面写着本次构建的
    # assets 文件名. 一旦它被缓存住, 用户拿到的就是旧 HTML 配新服务器上的
    # 新 assets —— 旧 HTML 引用的那些文件名已经不存在了, 页面白屏.
    # 这类问题还有个讨厌的地方: 强刷一下就没了, 所以它只会出现在一部分用户身上.
    #
    # expires -1 => Cache-Control: no-cache(每次都要回源确认, 没变就 304).
    # 不用 no-store: 那会让浏览器每次重新下整个文件, 而它其实带了 ETag,
    # 回源问一句的成本远低于重下一遍.
    location = /index.html {
        expires -1;
    }

    # SPA 回退: 前端的路由 (/profile、/anime/123) 在服务器上并没有对应的文件,
    # 直接把地址粘给别人或者刷新页面时, 请求会打到 nginx 而不是应用内跳转.
    # 没有这一行, 刷新任何一个子页面都是 404 —— 而首页永远正常, 因为 / 确实是个文件.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ------------------------------------------------------------
    #  反向代理
    # ------------------------------------------------------------

    location /api/ {
        # 末尾没有 URI 部分, 所以路径原样透传 (/api/user/login -> /api/user/login).
        # 写成 proxy_pass http://anitrack_backend/; (带斜杠) 会把 /api 前缀切掉,
        # 后端所有接口直接 404 —— 这是 nginx 最经典的一个坑, 两个写法的区别
        # 只在末尾那一个字符上.
        proxy_pass http://anitrack_backend;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;

        # **覆盖**而不是追加.
        #
        # $proxy_add_x_forwarded_for 的语义是「在客户端发来的那个头后面接一段」,
        # 而客户端可以随便编这个头. 后端的 Tomcat (forward-headers-strategy=native,
        # 见 application.yml) 会从右往左找第一个不可信地址当作真实 IP —— 那样确实
        # 也能得到真实客户端, 但前提是 Tomcat 的取值方向永远不变: 这个前提一旦被
        # 某次升级改掉, 限流 (按 IP 分桶) 就开始按攻击者编的地址分桶, 等于没有限流.
        # 用 $remote_addr 覆盖, 可信的那一段就只有 nginx 自己写进去的这一个.
        proxy_set_header X-Forwarded-For   $remote_addr;

        # 告诉后端"用户是用什么协议访问的". $scheme 是**本机这一段**的协议 ——
        # 本文件只监听 80, 所以现在恒为 http, 是对的.
        #
        # 但如果按 README「HTTPS」那一节在**这台 nginx 之外**又套了一层 TLS
        # (Caddy 反代 / 云负载均衡), 这一行就必须改成透传上游给的值:
        #     proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # 否则后端会以为每个请求都是 http. 不改也不会报错, 只会在
        # 需要判断协议的场合(重定向、secure cookie)悄悄做错事.
        proxy_set_header X-Forwarded-Proto $scheme;

        # 不缓冲响应.
        #
        # AI 助手走 SSE (/api/agent/chat/stream), 而 nginx 默认会把响应攒在缓冲区里
        # 凑够了再转发 —— 对普通 JSON 无所谓, 对 SSE 就是「工具调用过程一个字都看不到,
        # 直到最后整段答案一次性蹦出来」, 流式界面等于白做. 这里关掉缓冲,
        # 数据到一帧转一帧.
        proxy_buffering off;

        # 读超时必须**大于后端自己的整体超时**, 让后端永远是主动结束那一方.
        #
        # 后端一次提问的上限是 max-tool-rounds(6) × read-timeout(90s) + 60s = 600 秒
        # (见 application.yml 的 overall-timeout-ms). nginx 默认 60 秒就会把连接掐掉:
        # 用户看到的是答案说到一半断掉、且没有任何解释, 而后端并不知道客户端已经走了,
        # 还在继续跑完那 600 秒 —— 额度照烧.
        proxy_read_timeout 660s;
        proxy_send_timeout 660s;

        # 上游出错时不要把后端返回的详细错误页(可能带堆栈)原样给浏览器 ——
        # 那类页面会把内部主机名、路径结构一起暴露出去.
        proxy_intercept_errors off;
    }

    # 只放行健康检查这一个 actuator 端点.
    #
    # 不写成 location /actuator/ { ... } 的原因: 那等于把整个 actuator 一起代理出去,
    # 以后任何一次「顺手加一个 actuator 端点」都会自动出现在公网上.
    # 后端对 /actuator/env、/actuator/beans 这些是有鉴权的, 但公开与否这件事
    # 不该只由后端一处决定 —— nginx 这里再挡一道, 而且白名单是显式的.
    #
    # 精确匹配 (=) 让其他 /actuator/... 落到下面那个 404, 而不是被这里接住.
    location = /actuator/health {
        proxy_pass http://anitrack_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        # 这里**不需要**写 Cache-Control: nginx 默认不缓存任何上游响应,
        # 要缓存得显式声明一个 proxy_cache 区域 —— 本文件没有声明.
        # (记一笔: 将来谁要加 proxy_cache, 得先把 /actuator/health 和 /api/ 排除掉.
        #  一个被缓存住的 UP 会在服务真的挂掉之后继续对外报 UP, 而那正是
        #  监控最不该骗人的时候.)
    }

    # 没有列进白名单的 actuator 端点: 直接 404, 连后端都不问.
    # 用 404 而不是 403: 403 等于告诉对方「这里有东西, 只是不给你」.
    location /actuator/ {
        return 404;
    }

    # nginx 自己的探活端点 (Dockerfile 的 HEALTHCHECK 打的就是它).
    # 不走上游: 这个探针问的是「nginx 还在不在」.
    location = /healthz {
        access_log off;
        # 用 default_type 而不是 add_header Content-Type:
        # 后者是上面那条「add_header 不继承」的同一个坑 —— 在这里补一条,
        # 底下的三条安全响应头就没了.
        default_type text/plain;
        return 200 "ok\n";
    }

    # 安全响应头.
    # 这里只放与「怎么解析这个响应」有关的三个, 不做全套 CSP ——
    # CSP 要按前端的实际资源来源一条条调, 属于另一件事, 顺手写一个
    # 看起来严格但没人验证过的 CSP 只会让线上白屏.
    #
    # 这三条**只对静态文件有意义**: /api 的响应由 Spring Security 自己带一套
    # (见 SecurityConfig, X-Frame-Options 也是 sameOrigin, 值一致不冲突),
    # 两边都加的结果是那个头在响应里出现两次、值相同 —— 无害, 但不值得为它
    # 把 add_header 拆进各个 location 再手动抄三遍.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
