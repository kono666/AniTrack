# ============================================================
# Anime Tracker - 开发环境配置 (默认)
# 启动方式: mvn spring-boot:run
# 切换生产: mvn spring-boot:run -Dspring-boot.run.profiles=postgres
# ============================================================
server:
  port: 8080
  tomcat:
    uri-encoding: UTF-8

  # 反向代理后还原真实访客 IP.
  #
  # 项目里有两处按 IP 的限流(登录/注册见 AuthRateLimiter, AI 提问的访客见
  # AgentController.rateLimitKey), 取的都必须是**客户端**的 IP. 直连部署时
  # getRemoteAddr() 本来就是对的; 但放到 nginx 后面之后, 直连的那一方成了 nginx,
  # getRemoteAddr() 会给所有访客返回同一个地址, 限流退化成「全网共用一份配额」——
  # 一个人刷满, 别人全被挡在外面.
  #
  # 打开这个开关后, Tomcat 会在进入应用之前按 X-Forwarded-For 改写
  # getRemoteAddr() 的返回值, 上面那两处不用动就拿到了真实 IP.
  #
  # 为什么是 native 而不是 framework:
  #   native    = Tomcat 自带的 RemoteIpValve. 它**只在直连对端是可信代理时才认这个头**
  #               (默认可信范围 server.tomcat.remoteip.internal-proxies = 内网段 + 回环:
  #                10/8、172.16/12、192.168/16、169.254/16、127/8、::1).
  #               公网来的直连请求对端不在这个范围内, 它带的 X-Forwarded-For 会被
  #               原样忽略 —— 也就是「伪造请求头绕限流」在这条路上行不通.
  #   framework = Spring 的 ForwardedHeaderFilter. 它相信**任何**对端发来的这个头.
  #               一旦 8080 端口直接暴露在公网(或者被别的方式绕过 nginx), 攻击者
  #               每次请求换一个 X-Forwarded-For 就能拿到无限配额, 限流形同虚设.
  #   代价是 native 只认 Tomcat 自己那套配置, 不像 framework 那样与容器解耦 ——
  #   而这里本来就只有 Tomcat 一种部署方式, 换来的可信对端校验更值.
  #
  # 直连部署时这个配置意味着什么(要如实知道, 不是「没影响」):
  #   - 从公网直连 8080: 对端不在可信范围, X-Forwarded-For 被忽略, getRemoteAddr()
  #     仍然是对方的真实 IP. 限流按真实 IP 分桶, 且无法伪造;
  #   - 从本机或内网直连(此时对端是 127.0.0.1 或内网地址, **在**可信范围内):
  #     这个头会被采信. 能这么发请求的人本来就已经在机器/内网里了, 不是这个开关
  #     引入的新风险, 但也正是「8080 端口不该直接对公网暴露」的又一条理由 ——
  #     用 nginx 挡在前面, 并且让它**覆盖**这个头(见下).
  #
  # nginx 侧必须覆盖而不是追加: proxy_set_header X-Forwarded-For $remote_addr;
  # 追加($proxy_add_x_forwarded_for)会把客户端自己编的那一段也带上; Tomcat 的取值
  # 方向是从右往左找第一个不可信地址, 这种写法下它取到的仍是真实客户端, 但把
  # 「哪一段可信」这件事押在了 Tomcat 的实现细节上, 不如在 nginx 就掐掉. 落地位置
  # 是批次 7 的 nginx 配置.
  forward-headers-strategy: native

spring:
  profiles:
    active: dev

---
# ============================================================
# DEV Profile: H2 文件数据库
# ============================================================
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    # FILE_LOCK=NO 曾经写在这一行, 现已删除 —— 它在 MVStore 引擎 (H2 1.4+ 的默认引擎) 下
    # 是个彻头彻尾的空操作. MVStore 在打开文件时就以排他模式加锁, 完全不受 FILE_LOCK 影响
    # (官方 MVStore 文档原话: "When opening a store, the file is locked in exclusive mode,
    # so that the file can only be changed from within one process"). 留着它反而给人
    # 「这个库能被多个进程同时打开」的错觉, 而第二个进程实际只会撞上
    # MVStoreException: The file is locked —— 我们在 data/anitrack.trace.db 里就抓到过这条.
    # 真需要多进程访问应当改用 AUTO_SERVER=TRUE, 但 H2 官方不建议在生产用它,
    # 本项目开发时也不需要 (内置的 /h2-console 走的是同一个连接池, 不是第二个进程).
    url: jdbc:h2:file:./data/anitrack;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 10000
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      # 表结构从此由 Flyway 负责 (脚本在 db/migration/h2), Hibernate 不再改表.
      # 换成 validate 之后, 「实体改了、脚本没跟上」会在启动时直接报错,
      # 而不是像 update 那样静默地少建一个约束 (email 唯一约束就是这么漏过一次的).
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    # 只加载本环境这一套方言脚本. 两个目录各成一套、互不混用 ——
    # 混用会让「某个脚本到底在哪个环境跑过」变得说不清楚.
    locations: classpath:db/migration/h2

management:
  endpoint:
    health:
      # 本地把详情打开: /actuator/health 会列出每个组件 (数据库、磁盘) 各自的状态,
      # 启动异常时先看这里, 比翻日志快.
      # 生产环境必须关 —— 见 postgres 段里的同名字段.
      show-details: always

# JWT 密钥 —— 开发环境兜底值.
#
# 这个字符串是公开写在仓库里的, 所以 JwtUtil 里配了一条硬校验:
# 只要在非 dev profile 下检测到它, 应用会直接启动失败.
#
# 要防的不是「本地懒得配」, 而是「部署时忘了配 JWT_SECRET」——
# 那种情况下服务会照常启动、功能一切正常, 但任何人都能用这个公开字符串
# 伪造出管理员 token. 报错要留在启动时, 而不是留到被人打穿之后.
jwt:
  secret: ${JWT_SECRET:AniTrack-Dev-Only-Secret-Change-In-Production!!}

# 首次启动的账号引导 (开发环境).
#
# 兜底值是为了满足「clone 下来直接就能跑」. 这些凭据是公开的, 所以只能出现在
# 本地 —— 生产环境不提供任何兜底密码, 没配 ADMIN_PASSWORD 且库里还没有管理员
# 时, 应用会拒绝启动.
app:
  bootstrap:
    admin-username: ${ADMIN_USERNAME:admin}
    admin-password: ${ADMIN_PASSWORD:admin123}
    admin-email: ${ADMIN_EMAIL:}
    # 演示账号 test 的密码公开写在 README 里, 只有本地才该存在
    demo-user-enabled: true

---
# ============================================================
# PROD Profile: PostgreSQL
# 环境变量: DB_URL, DB_USER, DB_PASS
# 启动: docker-compose up -d  (启动 PostgreSQL)
#       mvn spring-boot:run -Dspring-boot.run.profiles=postgres
# 首次运行后可将 ddl-auto 改为 validate 防止误操作
# ============================================================
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/anitrack}
    username: ${DB_USER:anitrack}
    password: ${DB_PASS:anitrack}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # 与 dev 同理: 结构归 Flyway (脚本在 db/migration/postgres), Hibernate 只做校验.
      # 首次部署也不再需要「先让 update 建表、之后再改成 validate」这个两步走 ——
      # 表由 V1 建好, 启动时校验即可.
      ddl-auto: validate
    show-sql: false
  flyway:
    locations: classpath:db/migration/postgres
  h2:
    console:
      enabled: false

management:
  endpoint:
    health:
      # 与 dev 相反: 公网只允许看到 {"status":"UP"} 这一层.
      # 详情里会带组件名 (数据库、磁盘、连接池), 属于内部结构信息 ——
      # 探活只需要一个 UP/DOWN, 不需要知道是哪个组件在打盹.
      # 这里刻意显式写出来而不是靠默认值: 默认值将来变了不会报错, 只会静默泄露.
      show-details: never

# JWT 密钥 —— 生产环境.
#
# 刻意不给任何兜底值: 没配 JWT_SECRET 时这里解析为空字符串,
# JwtUtil 会直接抛异常让应用启动失败.
# 宁可起不来, 也不要拿一个公开的密钥上线 ——
# 「启动失败」是可恢复的故障, 「密钥泄露」不是.
jwt:
  secret: ${JWT_SECRET:}

# 首次启动的账号引导 (生产环境).
#
# 刻意不给密码兜底值: 没配 ADMIN_PASSWORD 且库里还没有管理员时,
# DataInitializer 会让应用直接启动失败 —— 一个公开的默认管理员密码
# 比「起不来」危险得多.
# 只在第一次部署 (库里还没有管理员) 时需要提供, 之后重启不再要求.
#
# 这里把四个值都重写了一遍, 而不是只写与 dev 不同的两个: 安全配置宁可
# 重复也不要依赖继承 —— 继承关系一旦被改动, 「生产悄悄用上了开发密码」
# 这种事不会报错, 只会静默发生, 正是这次要消灭的故障模式.
app:
  bootstrap:
    admin-username: ${ADMIN_USERNAME:admin}
    admin-password: ${ADMIN_PASSWORD:}
    admin-email: ${ADMIN_EMAIL:}
    # 演示账号的密码是公开的, 不该出现在生产
    demo-user-enabled: false

---
# ============================================================
# 公共配置 (所有 profile 生效)
# ============================================================
spring:
  # ============================================================
  # 数据库迁移 (Flyway)
  #
  # 表结构从此由 src/main/resources/db/migration 下的编号脚本负责, Hibernate 不再改表
  # (各 profile 的 ddl-auto 已改成 validate)。每个环境用哪套脚本在各自的 profile 里指定。
  #
  # 这一步解决的是「代码改完了、库没跟上」这类最难查的问题: 改动不再靠 Hibernate
  # 猜着执行, 而是变成仓库里一个能 review、能回放、编号唯一且执行过的脚本不会被修改
  # (Flyway 会校验校验和)的文件。
  #
  # baseline-on-migrate: 给「Flyway 之前就存在的库」留一条生路。
  #   那种库里已经有表和数据, 但没有 flyway_schema_history 表 —— 直接跑 V1 会因为
  #   「表已存在」失败。打开这个开关后, Flyway 遇到这种库不执行任何脚本, 只写一条
  #   「基线已到 1」的记录, 然后从 V2 开始跑。
  #   全新的空库不走基线逻辑, 老老实实从 V1 开始建表 —— 一套配置覆盖两种情况。
  #
  # baseline-version: 定在 1 而不是默认的 0, 因为 V1 就是「老库当初由 ddl-auto 建出来的
  #   那个结构」。定成 0 的话老库会去执行 V1, 照样撞上「表已存在」。
  # ============================================================
  flyway:
    baseline-on-migrate: true
    baseline-version: 1

# ============================================================
# 探活端点 (Actuator)
#
# 只开 health 一个. 这里显式写出来、而不是依赖 Boot 的默认值, 有两层意思:
#   1) 默认值将来变了, 或者谁为了调试临时改成 "*", 不会有人察觉 —— 写在这里的
#      是一个能被 review、能被测试钉住的清单.
#   2) /actuator 下还有 env, beans, configprops 这类会打印内部结构的端点.
#      它们对排查很有用, 但只该在本机用, 不该跟着构建产物上公网.
#
# 各环境能看到多少 health 详情在 profile 段里定 (dev 打开、postgres 关闭).
# 另外 SecurityConfig 里还有一道兜底: 除 health 外的 /actuator/** 需要管理员身份.
#
# ── 健康检查分成两组, 因为「容器还活着吗」和「现在能不能给它流量」是两个问题 ──
#
#   liveness  : 只问进程本身. 容器探针 (HEALTHCHECK) 用它.
#   readiness : 加上依赖 (数据库、磁盘). 负载均衡 / 编排系统用它决定要不要发流量.
#
# 为什么要分开, 是被实测逼出来的: 数据库停掉时, 带 db 的那份 health 要等
# Hikari 的连接超时 (postgres profile 是 30 秒) 才会回 503 —— 实测 30.0 秒,
# Spring 自己都会记一条 "took 30016ms to respond" 的警告.
# 拿它当容器探针有两个问题:
#   1) 探针必须快且有界, 30 秒的响应会先撞上探针超时, 于是「超时」和
#      「依赖不可用」两种状态被混成一种, 排障时分不清;
#   2) 数据库挂了就去重启后端容器, 这个动作本身解决不了任何问题,
#      restart: unless-stopped 会把它变成一轮一轮的重启循环.
# 「依赖不可用」的正确表达是别再往它这儿发流量, 那是 readiness 的职责.
# ============================================================
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      group:
        liveness:
          include: ping
        readiness:
          include: db,diskSpace

jwt:
  # 密钥有效期 (毫秒), 默认 7 天. 密钥本身在各 profile 内定义 (见上),
  # 因为「开发可以兜底、生产必须显式提供」这个差异只能按环境表达.
  expiration: 604800000

# ============================================================
# 跨域访问白名单
#
# 默认留空 —— 本项目按同源部署设计, 本来就不需要 CORS:
#   开发: Vite 把 /api 代理给后端, 浏览器只跟 5173 说话
#   生产: nginx 把 /api 反代给后端, 前后端同域
# 白名单为空时后端完全不注册 CORS 过滤器, 少一层就少一处边界情况.
#
# 只有「前端确实要部署在另一个域名下」时才需要填, 例如:
#   CORS_ALLOWED_ORIGINS=https://anitrack.example.com,https://www.anitrack.example.com
#
# 填之前请先确认前端也改了 —— 现在前端的 API 地址是写死的相对路径 /api,
# 光配后端跨域是跑不通的, 必须先把前端改成可配置的绝对地址.
#
# 这里不给任何兜底值, 也不写成 * : 一个公开仓库里写死的 * 会让任何网站
# 都能跨域调用本 API, 而它看起来只是行无害的配置.
# ============================================================
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

  # ============================================================
  # 登录爆破防护
  #
  # 连续失败 max-failures 次后锁定账号 lock-minutes 分钟; 中间成功登录一次即清零.
  # 锁定期内即使密码正确也拒绝, 否则锁定就只是限速, 不是锁定.
  #
  # 为什么是「限时锁定」而不是「永久锁定」:
  # 本项目没有找回密码、没有邮箱验证, 永久锁定意味着任何人只要知道你的用户名,
  # 连试 5 次就能让你永久登不进来 —— 那是拒绝服务, 不是防护.
  #
  # 留成环境变量是为了公网部署时能收紧 (比如 3 次 / 60 分钟),
  # 而本地开发想放宽时不用改代码重新打包.
  #
  #   LOGIN_MAX_FAILURES  默认 5
  #   LOGIN_LOCK_MINUTES  默认 15
  # ============================================================
  security:
    login:
      max-failures: ${LOGIN_MAX_FAILURES:5}
      lock-minutes: ${LOGIN_LOCK_MINUTES:15}
    # ------------------------------------------------------------
    # 注册 / 登录的按 IP 限流 (见 AuthRateLimiter).
    #
    # 上面那个 login.* 是**按账号**的纵向防护(盯着一个账号猛试会被锁);
    # 这一节是**按 IP** 的横向防护 —— 拿一份用户名字典每个账号只试一次,
    # 谁也锁不上, 只有按来源限流拦得住. 同时它也是 CPU 兜底: 每次登录
    # 都要跑一次 BCrypt(约 100ms), 没有这一层, 一个脚本就能把 CPU 打满.
    #
    # 注意是「每个 IP」: NAT 后面的用户共享同一个出口 IP, 配额是大家一起用的,
    # 所以数字给得比「一个人能试几次」宽. 公网部署若出现误伤, 调这两个环境变量
    # 即可, 不必改代码重新打包.
    #
    #   REGISTER_RATE_LIMIT_PER_MINUTE  默认 5
    #   LOGIN_RATE_LIMIT_PER_MINUTE     默认 10
    # ------------------------------------------------------------
    rate-limit:
      register-per-minute: ${REGISTER_RATE_LIMIT_PER_MINUTE:5}
      login-per-minute: ${LOGIN_RATE_LIMIT_PER_MINUTE:10}

bangumi:
  api:
    base-url: https://api.bgm.tv
    user-agent: AniTrack/1.0 (https://github.com/anitrack)
    subject-cache-hours: 24
    episode-cache-hours: 24
    search-cache-hours: 1
    calendar-cache-hours: 1

# ============================================================
# 大模型接入 (AI 助手)
# 密钥只从环境变量读取, 绝不写进代码库.
#
#   LLM_PROVIDER  anthropic | openai-compat | mock
#   LLM_API_KEY   各厂商控制台申请
#   LLM_BASE_URL  DeepSeek -> https://api.deepseek.com
#                 Claude   -> https://api.anthropic.com
#   LLM_MODEL     DeepSeek -> deepseek-chat
#                 Claude   -> claude-sonnet-5
#
# 未配置密钥时应用仍可正常启动, 仅 AI 助手会提示需要配置.
# ============================================================
llm:
  provider: ${LLM_PROVIDER:openai-compat}
  base-url: ${LLM_BASE_URL:https://api.deepseek.com}
  api-key: ${LLM_API_KEY:}
  model: ${LLM_MODEL:deepseek-chat}

  # 单次回复最大 token
  max-tokens: 2048
  temperature: 0.7

  # 单次对话最多工具调用轮数 (防死循环烧钱)
  max-tool-rounds: 6

  # 带入上下文的历史消息条数上限
  history-limit: 20

  # 单用户每分钟提问次数上限.
  # 走环境变量是为了公网 Demo 能在部署面板上收紧, 而不用改代码重新打包 ——
  # 本地开发可以放宽, 公网必须比本地严.
  rate-limit-per-minute: ${LLM_RATE_LIMIT_PER_MINUTE:10}

  # 全站每日模型调用次数上限 (0 = 不限).
  # 公网 Demo 靠它兜住账单: 按人限流挡不住「很多人同时各问几次」.
  # 一次提问最多触发 max-tool-rounds 次模型调用, 所以这个数字要按轮数算.
  daily-call-budget: ${LLM_DAILY_BUDGET_CALLS:500}

  # 单次提问最大字符数
  max-input-length: 1000

  # 单个工具返回结果的最大字符数 (超出截断, 防 token 爆炸)
  max-tool-result-chars: 6000

  connect-timeout: 10000
  read-timeout: 90000

  # 一次提问的整体超时(毫秒). 0 = 自动推导: max-tool-rounds × read-timeout + 60 秒.
  #
  # 与上面两个的区别: connect/read 管「一次模型调用最多等多久」, 这个管「一整次提问
  # 最多跑多久」. 一次提问最多跑 6 轮、每轮一次模型调用, 默认推导出来是 6 × 90 + 60
  # = 10 分钟 —— 看着长, 但正常跑完就结束了, 这个值只在真的卡住时才生效.
  # 反过来, 拿 read-timeout(90 秒)直接当整次提问的上限是错的: 正常但慢的请求会被
  # 中途掐断, 前端看到的是「流莫名其妙断了」.
  overall-timeout-ms: 0
