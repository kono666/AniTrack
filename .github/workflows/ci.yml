# ============================================================
#  CI —— 每次推送到 main / 每个 PR 都跑一遍
#
#  三个 job 各自回答一个不同的问题:
#    backend   —— 代码逻辑还对吗? (后端全部用例)
#    frontend  —— 组件还对吗? 前端还构建得出来吗?
#    image     —— 这东西真的能部署吗? (构建两个镜像 + 起真 compose 栈冒烟)
#
#  最后一个是有意加的. Dockerfile 和 docker-compose.yml 在写完之后是「看起来对」的状态:
#  本机没有 Docker, 谁也没法执行一次. 部署配置最大的特点就是「写错了不会报错,
#  只会在别人机器上炸」—— 所以这里用真实 PostgreSQL 把它跑起来.
#
#  冒烟请求**全部打 nginx**, 不直连后端 —— 因为部署之后本来就只有一个入口
#  (后端不对宿主机开端口), 所以「经 nginx 能用」才是那个唯一值得断言的东西.
#  顺带钉住的: 静态资源真的被打进镜像了、深层路由刷新不 404、actuator 白名单
#  只放行一个端点、迁移脚本在已经迁移过的库上重放安全且能补回被拿掉的约束、
#  每天那份备份真的产出了而且真的恢复得回来、以及 Agent 全链路
#  (工具调用 -> 番剧卡片 -> SSE 分帧 -> 额度扣减) 在 mock 模型下真的跑得通.
#
#  曾经写着「不跑 scripts/verify-agent.py」, 理由是「它要真实 LLM 额度」.
#  那句理由是错的: 脚本对应的 README 那一段自己就写着 LLM_PROVIDER=mock
#  「不产生任何费用」—— 同一件事在两处说法相反, 而且恰好是让 CI 少跑一段的那个说法
#  被写进了 CI. 现在按能免费跑的那一种落地: 下面 .env 里给了 mock.
#
#  刻意不做的事:
#   - 不做镜像推送 (没有镜像仓库; 这一版的目标只是「构建得出来 + 跑得起来」)
# ============================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 允许在 Actions 页面手动点一次, 排查问题时不用先编一个空提交
  workflow_dispatch:

# 只需要读代码. 显式写出来, 免得 fork 来的 PR 拿到超出所需的权限
permissions:
  contents: read

# 同一个分支连推几次时, 取消掉还在跑的旧一轮 —— 新提交的结论才有意义
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端 · 单元与集成测试
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: anime-tracker/backend
    steps:
      - uses: actions/checkout@v7

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          # 缓存 ~/.m2/repository. key 会跟着 pom.xml 的哈希走, 改依赖才会重下
          cache: maven

      # -B 关掉交互与 ANSI 进度条 (日志里不要塞控制字符), -ntp 关掉下载进度行
      - name: 跑测试
        run: mvn -B -ntp test

      # 测试挂了的时候, 光看控制台那几行不够 —— 完整报告留下来
      - name: 存测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: anime-tracker/backend/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: 前端 · 测试与构建
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: anime-tracker/frontend
    steps:
      - uses: actions/checkout@v7

      - name: 装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: anime-tracker/frontend/package-lock.json

      # 用 ci 而不是 install: 它严格按 package-lock.json 装, 锁文件与 package.json
      # 一旦对不上就直接失败. install 会「顺手把锁文件改了」, 那等于把 CI 变成
      # 又一个能产出提交的地方 —— CI 只该验证, 不该改文件
      - name: 装依赖
        run: npm ci

      # vitest run = 跑一遍就退出. 不写 run 的话默认进 watch 模式, 会在 CI 里一直挂着
      - name: 跑测试
        run: npm run test

      - name: 构建
        run: npm run build

      - name: 存构建产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: anime-tracker/frontend/dist/
          retention-days: 7

  image:
    name: 镜像 · 构建 + compose 冒烟
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # 测试先过再花时间构建镜像 —— 测试都红的时候没必要再等一次镜像构建
    needs: [backend]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      # 两阶段构建里最慢的是「下 Maven 依赖」那一层. 缓存交给 GitHub Actions 的
      # 缓存服务, 第二次之后的运行能省掉几分钟 —— 否则每次提交都要重下一遍依赖.
      - name: 构建后端镜像
        uses: docker/build-push-action@v6
        with:
          context: ./anime-tracker/backend
          # 本机构建默认不跑测试 —— 上面 backend job 已经跑过一次了, 没必要再来一遍.
          # 这里要证明的是「能打出可运行的镜像」.
          tags: anitrack-backend:latest
          # load: 把镜像留在本机 docker 里, 下一步的 compose 才有得用
          # (不 load 的话构建完只存在于 buildx 的缓存里, docker compose 看不到)
          load: true
          # scope 是给这个 job 里两个 buildx 构建分家用的: 它们共用同一个 gha 缓存
          # 后端, 不带 scope 时两边的层会写到同一个 key 下互相顶掉 ——
          # 症状不是报错, 只是"缓存好像没生效", 每次都要重下依赖.
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # 前端镜像里是「nginx + 现构建出来的 dist」, 构建它同时验证了两件事:
      # 前端在 Linux 上构建得出来(本机是 Windows, 原生依赖的平台差异只有这里能发现),
      # 以及 Dockerfile 里的两阶段拷贝没写错路径.
      - name: 构建前端镜像
        uses: docker/build-push-action@v6
        with:
          context: ./anime-tracker/frontend
          tags: anitrack-frontend:latest
          load: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # 这两个值在本次运行里现生成.
      # 不在仓库里写死任何看起来像密钥的东西 —— 就算它只是给一次性的冒烟容器用,
      # 躺在仓库里的 JWT_SECRET=... 也一定会在某个时刻被人复制到别处.
      - name: 生成一次性凭据
        run: |
          {
            echo "CI_JWT_SECRET=$(openssl rand -hex 32)"
            echo "CI_ADMIN_PASSWORD=ci$(openssl rand -hex 6)"
          } >> "$GITHUB_ENV"

      # compose 会自动读同目录下的 .env, 所以部署时那一套变量在这里原样走一遍
      #
      # HTTP_PORT 写 8080 而不是留空用默认的 80, 是刻意的:
      # 这样"这个变量确实被 compose 读到了"本身也变成了被验证的一件事.
      # 如果 compose 里那行 mapping 哪天被改回硬编码的 80, 下面的 curl 会连不上,
      # 而不是"照样通过" —— 端口这类配置最怕的就是改了个不生效还没人知道.
      # LLM_PROVIDER=mock 是给下面那段 Agent 端到端用的.
      #
      # 不写的话它会落到 compose 里的默认值 openai-compat, 而 CI 没有 API Key ——
      # 后端照样起得来、上面那 9 节冒烟照样全过, 只有端到端会以「助手未配置」收场.
      # mock 是仓库自己支持的取值 (MockLlmClient), 输出带【Mock 模式】前缀,
      # 不会伪装成真回复, 也不产生任何费用.
      #
      # .env 里只写 KEY=value, 解释留在这一层: 那个文件是给 compose 吃的,
      # 而本机没有 Docker, 往里塞任何非赋值内容都没法在本地验一遍.
      - name: 生成 CI 用的 .env
        env:
          # 非密钥, 只是本次冒烟的管理员用户名
          CI_ADMIN_USERNAME: ciadmin
        run: |
          cat > .env <<EOF
          DB_NAME=anitrack
          DB_USER=anitrack
          DB_PASS=ci${CI_JWT_SECRET:0:12}
          JWT_SECRET=${CI_JWT_SECRET}
          ADMIN_USERNAME=${CI_ADMIN_USERNAME}
          ADMIN_PASSWORD=${CI_ADMIN_PASSWORD}
          ADMIN_EMAIL=ci@example.com
          HTTP_PORT=8080
          LLM_PROVIDER=mock
          EOF

      - name: 起 compose 栈并等它健康
        # --wait 会一直等到每个服务都 healthy 才返回, 比「up 完 sleep 30」可靠:
        # 后者在慢机器上就是随机失败, 在快机器上就是白等.
        # 等不到会直接返回非零 —— 这一步本身就证明了 Dockerfile 里那条 HEALTHCHECK 是对的.
        run: docker compose up -d --wait --wait-timeout 240

      - name: 冒烟 (全部经 nginx)
        env:
          CI_ADMIN_USERNAME: ciadmin
          # 入口是 nginx. 注意这里没有"另一个地址"可打 —— 后端已经不对宿主机开端口了,
          # 所以这一整个步骤顺带就是"入口只有一个"的验证: 以前这里写的是直连后端的 8080.
          BASE: http://localhost:8080
          DB_NAME: anitrack
          DB_USER: anitrack
        run: |
          set -euo pipefail

          # 每个断言都打印一行, 失败时日志里能直接看出卡在哪一条
          assert_status() {
            local expect="$1" url="$2"
            local got
            got=$(curl -s -o /tmp/body -w '%{http_code}' "$url")
            if [ "$got" != "$expect" ]; then
              echo "FAIL: $url 期望 $expect, 实际 $got"
              cat /tmp/body; echo
              exit 1
            fi
            echo "ok: $url -> $got"
          }

          # 响应头断言. 只看有没有这个头, 不看值 —— 要钉的是
          # "这条配置还在生效", 而不是它的具体取值
          assert_header() {
            local url="$1" name="$2"
            if ! curl -sI "$url" | grep -qi "^${name}:"; then
              echo "FAIL: $url 的响应里没有 $name"
              curl -sI "$url"
              exit 1
            fi
            echo "ok: $url 带 $name"
          }

          echo "--- 1. 静态站真的被托管了 (首页 200, 且它引用的资源拿得到) ---"
          #
          # 这一条挡的是"容器起来了但 dist 是空的/是旧的": 那种情况下
          # compose 一样健康、探活一样 UP, 只有打开页面才白屏.
          assert_status 200 "$BASE/"
          grep -q '<div id="app"' /tmp/body || { echo "FAIL: 首页不是应用外壳"; cat /tmp/body; exit 1; }
          asset=$(grep -o '/assets/[A-Za-z0-9._-]*\.js' /tmp/body | head -1)
          test -n "$asset" || { echo "FAIL: 首页里没有引用任何 /assets/*.js"; cat /tmp/body; exit 1; }
          assert_status 200 "$BASE$asset"

          echo "--- 2. 缓存与安全响应头 (这两条都是 add_header 那个坑的哨兵) ---"
          #
          # nginx 的 add_header 不继承: 任何 location 里写一条, server 层那几条就全没了.
          # 所以这里既看"该长期缓存的带没带 max-age", 也看"三条安全头还在不在"——
          # 只查其中一个的话, 另一边的静默失效不会有任何提示.
          curl -sI "$BASE$asset" | grep -qi 'cache-control:.*max-age' \
            || { echo "FAIL: 带哈希的资源没有长缓存"; curl -sI "$BASE$asset"; exit 1; }
          echo "ok: $asset 带长缓存"
          curl -sI "$BASE/" | grep -qi 'cache-control:.*no-cache' \
            || { echo "FAIL: index.html 被缓存住了(会配出新旧资源)"; curl -sI "$BASE/"; exit 1; }
          echo "ok: index.html 不缓存"
          assert_header "$BASE/" X-Content-Type-Options
          assert_header "$BASE/" X-Frame-Options
          assert_header "$BASE/" Referrer-Policy

          echo "--- 3. 深层路由刷新不 404 (SPA 回退) ---"
          #
          # /profile 在服务器上并没有这个文件. 没有 try_files 回退的话,
          # 手输地址或刷新子页面就是 404 —— 而首页永远正常, 所以本地点一遍发现不了.
          assert_status 200 "$BASE/profile"
          grep -q '<div id="app"' /tmp/body || { echo "FAIL: /profile 没有回退到应用外壳"; cat /tmp/body; exit 1; }

          echo "--- 4. 整体探活 (免登录; 库连不上时聚合状态会是 DOWN) ---"
          assert_status 200 "$BASE/actuator/health"
          grep -q '"status":"UP"' /tmp/body || { echo "FAIL: health 不是 UP"; cat /tmp/body; exit 1; }

          echo "--- 5. actuator 白名单只放行一个端点 ---"
          assert_status 404 "$BASE/actuator/env"
          assert_status 404 "$BASE/actuator/beans"
          assert_status 404 "$BASE/actuator/health/liveness"
          # 上面那三个 404 是 nginx 挡的, 所以还证明不了后端自己也在挡.
          # 从容器内部直连后端问一次 —— 401 才说明是"两层都在挡".
          # (后端不对宿主机开端口, 这是唯一够得着它的方式; 也顺便演示了
          #  运维时要直连后端该怎么做, 见 docker-compose.yml 里那段注释.)
          direct=$(docker compose exec -T backend wget -qO- http://localhost:8080/actuator/env 2>&1 || true)
          case "$direct" in
            *401*) echo "ok: 容器内直连后端 /actuator/env -> 401" ;;
            *) echo "FAIL: 期望直连后端拿到 401, 实际: $direct"; exit 1 ;;
          esac

          echo "--- 6. 空库上由环境变量建出管理员, 且能登录 ---"
          code=$(curl -s -o /tmp/login -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"${CI_ADMIN_USERNAME}\",\"password\":\"${CI_ADMIN_PASSWORD}\"}" \
            "$BASE/api/user/login")
          test "$code" = "200" || { echo "FAIL: 管理员登录 $code"; cat /tmp/login; exit 1; }
          grep -q '"code":200' /tmp/login || { echo "FAIL: 登录响应体不对"; cat /tmp/login; exit 1; }
          echo "ok: 管理员登录 200"

          echo "--- 7. 迁移建出来的表能读 (证明结构不只是 validate 过得去) ---"
          assert_status 200 "$BASE/api/review/list?subjectId=1"

          echo "--- 8. 迁移脚本在已迁移的库上重放安全, 且能补回被拿掉的约束 ---"
          #
          # 这一条测的是别处都测不到的一支: 全新的库上 V2/V3 只跑一次,
          # 所以那两个「先判断再改」的匿名块里 "已经存在" 那一支从来没被执行过.
          # 而部署到真服务器时用的**恰恰是**那一支 —— 线上库是老的,
          # 约束可能早就被 Hibernate 用别的名字建出来了.
          psql_() {
            docker compose exec -T postgres psql -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 -tAq "$@"
          }
          replay() {  # 把仓库里那份迁移文件原样喂给 psql (不是另抄一份 SQL, 抄的那份会走偏)
            docker compose exec -T postgres psql -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 -q -f - \
              < "anime-tracker/backend/src/main/resources/db/migration/postgres/$1.sql"
          }
          # 唯一索引总数(不含主键). 不写死数字, 拿"重放前"当基准:
          # 重放只允许让它保持不变. 变多 = 重复加了一条同列约束(白白多一个索引),
          # 而这正是 V2 注释里说的那个坑.
          unique_idx_count() {
            psql_ -c "SELECT count(*) FROM pg_index i JOIN pg_class c ON c.oid = i.indrelid
                      WHERE i.indisunique AND NOT i.indisprimary
                        AND c.relname IN ('anime_tracking','review','episode_watched','user');"
          }

          before=$(unique_idx_count)
          echo "重放前唯一索引数: $before"
          # 注意 -v ON_ERROR_STOP=1 是必须的: 不加的话 psql 出错也返回 0,
          # 于是"脚本炸了"和"脚本跑通了"在 CI 里长得一模一样
          replay V2__align_legacy_schema
          replay V3__add_unique_constraints
          after=$(unique_idx_count)
          test "$after" = "$before" \
            || { echo "FAIL: 重放后唯一索引从 $before 变成 $after (重复添加了)"; exit 1; }
          echo "ok: 重放两次没有多出索引"

          # 把其中一条拿掉再放一次 —— 证明那几个匿名块不是"永远跳过".
          # (这个库是本次运行新建的一次性库, 后面 down -v 会整个删掉)
          psql_ -c "ALTER TABLE review DROP CONSTRAINT uk_review_user_subject;"
          dropped=$(unique_idx_count)
          test "$dropped" = "$((before - 1))" \
            || { echo "FAIL: 拿掉一条后应为 $((before - 1)), 实际 $dropped"; exit 1; }
          replay V3__add_unique_constraints
          restored=$(unique_idx_count)
          test "$restored" = "$before" \
            || { echo "FAIL: 重放没能把约束补回来(期望 $before, 实际 $restored)"; exit 1; }
          echo "ok: 被拿掉的唯一约束能重新补上"

          echo "--- 9. 备份: 有产出、是完整的、而且真的恢复得回来 ---"
          #
          # 备份是那种"平时没人看、只在最需要的那一刻被打开"的东西,
          # 所以这里查的不是"容器还在跑", 而是文件本身.
          dump=$(docker compose exec -T backup sh -c 'ls -1t /backup/anitrack-*.sql.gz | head -1' | tr -d '\r')
          test -n "$dump" || { echo "FAIL: 备份目录里没有 dump"; docker compose logs --no-color backup; exit 1; }
          echo "ok: 有备份 $dump"

          # 三条分开查, 因为失败原因不同, 报出来的话也不一样:
          #   不是 gzip        -> 文件本身坏了
          #   没有收尾标记     -> pg_dump 中途断了(截断的 dump 一样能解压, 光看大小看不出来)
          #   没有 CREATE TABLE -> 备份的是个空库
          docker compose exec -T backup sh -c "gzip -t '$dump'" \
            || { echo "FAIL: $dump 不是完整的 gzip"; exit 1; }
          docker compose exec -T backup sh -c "gzip -dc '$dump' | tail -n 5 | grep -q 'PostgreSQL database dump complete'" \
            || { echo "FAIL: $dump 缺少 pg_dump 的收尾标记(截断的)"; exit 1; }
          docker compose exec -T backup sh -c "gzip -dc '$dump' | grep -q 'CREATE TABLE'" \
            || { echo "FAIL: $dump 里没有建表语句"; exit 1; }
          echo "ok: 备份文件完整且不是空的"

          # 恢复演练: 把 dump 灌进一个临时库, 再和源库比对一张**有数据**的表的行数.
          # 前面三条只证明得了 pg_dump 跑完了, 证明不了 psql 能把它吃回去 ——
          # 而"从没恢复过的备份等于一份猜测"这句话, 只能靠这一步来反驳.
          psql_db() { docker compose exec -T postgres psql -U "$DB_USER" -d "$1" -tAq -c "$2"; }
          psql_db postgres 'DROP DATABASE IF EXISTS restore_check' >/dev/null
          psql_db postgres 'CREATE DATABASE restore_check' >/dev/null
          docker compose exec -T backup sh -c "gzip -dc '$dump'" \
            | docker compose exec -T postgres psql -U "$DB_USER" -d restore_check -v ON_ERROR_STOP=1 -q
          src=$(psql_db "$DB_NAME" 'SELECT count(*) FROM "user"')
          dst=$(psql_db restore_check 'SELECT count(*) FROM "user"')
          test "$src" = "$dst" && test "$src" != "0" \
            || { echo "FAIL: 恢复后 user 表 $dst 行 ≠ 源库 $src 行"; exit 1; }
          echo "ok: 恢复演练通过 (user 表 $dst 行, 与源库一致)"

          echo "全部冒烟通过"

      # Agent 全链路的端到端验证, 用 mock 模型, 不产生任何费用.
      #
      # 这一段的断言只有真跑起来才看得见: 普通用户拿不到管理员的工具、
      # 越权访问回 403、SSE 真的按事件名分帧推、工具结果里的番剧行真的带了
      # 可直接渲染的卡片、额度按实际轮数扣. 这些逻辑写错了不会在单元测试里露头 ——
      # 它们坏掉的样子是「演示当天前端一片空白」.
      #
      # 打的是 nginx 的 8080, 和真人用同一个入口. SSE 能过 nginx 是因为
      # nginx.conf 的 location /api/ 里关了 proxy_buffering —— 不关的话
      # 流式响应会被攒到最后一次性吐出来, 这一段会挂在一个和代码无关的地方.
      - name: 端到端 (Agent 全链路, mock 模型)
        env:
          CI_ADMIN_USERNAME: ciadmin
          AGENT_BASE: http://localhost:8080
          AGENT_ADMIN_USER: ciadmin
          # postgres profile 下 BootstrapProperties.demoUserEnabled=false,
          # 所以 test/test123 那个 demo 用户**不存在** —— 下面现场注册一个.
          AGENT_USER_USER: citest
          # 不能沿用 test123: PasswordPolicy 要求至少 8 位且同时含字母和数字,
          # "test123" 只有 7 位, 连注册都过不去 (dev 里那个 demo 用户是引导代码
          # 直接建的, 没走参数校验, 所以它能存在 —— 这个差别正好在这里露出来).
          AGENT_USER_PASS: citest12345
        run: |
          set -euo pipefail

          # 管理员密码本次运行现生成, 从环境里取, 不落进仓库
          export AGENT_ADMIN_PASS="$CI_ADMIN_PASSWORD"

          echo "--- 先注册一个普通用户 (CI 里没有 demo 用户) ---"
          code=$(curl -s -o /tmp/reg -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"$AGENT_USER_USER\",\"email\":\"citest@example.com\",\"password\":\"$AGENT_USER_PASS\"}" \
            "$AGENT_BASE/api/user/register")
          test "$code" = "200" || { echo "FAIL: 注册普通用户 -> $code"; cat /tmp/reg; exit 1; }
          echo "ok: 普通用户 $AGENT_USER_USER 注册成功"

          echo "--- 跑 scripts/verify-agent.py ---"
          # pipefail 上面已开, 所以脚本的非零退出码能穿过 tee 传出来
          python3 anime-tracker/scripts/verify-agent.py 2>&1 | tee /tmp/agent.log

          # 额外钉一条脚本自己钉不了的.
          #
          # 脚本要能在任意 provider 下跑, 所以「mock 到底调没调到工具」不能写死在它里面;
          # 但 CI 知道自己给的是 mock, 可以在这里查.
          #
          # 为什么非查不可: 脚本里那几十条卡片断言都是
          # 「**如果**有带 type=anime 标记的行, 就必须带卡片」的形式. 于是当
          # api.bgm.tv 不通、工具返回空的时候, 那些断言会**全部空转通过** ——
          # RESULT 照样 FAIL=0, 退出码照样 0, 而卡片那条链路压根没被检查过.
          # 一个绿色的、但什么都没验的 CI, 比一个红色的更糟.
          tagged=$(grep -o 'carrying tagged anime rows=[0-9]*' /tmp/agent.log \
                   | grep -o '[0-9]*$' | tail -1 || true)
          test -n "$tagged" \
            || { echo "FAIL: 日志里找不到 'carrying tagged anime rows' 这一行"; exit 1; }
          test "$tagged" -ge 1 \
            || { echo "FAIL: 工具结果里没有带 type=anime 的行 (=$tagged), 卡片断言全部空转了."
                 echo "      多半是 api.bgm.tv 不通或被限流 —— 不是代码的问题, 但也不能算通过."
                 exit 1; }
          echo "ok: mock 真的调到了工具, 结果带 $tagged 组番剧行 (卡片断言不是空转)"

      # 失败了才有必要看日志 —— 平时打出来只会把有效信息淹掉.
      #
      # 除了应用日志, 还要把 **探针自己的输出**打出来.
      # 起因是 CI #22: nginx 起来了、配置也解析了, 但被判 unhealthy,
      # 而 docker compose logs 里一行相关的话都没有 —— 探针失败的原因不在容器
      # 的 stdout 里, 在它的 health log 里. 那次是从"localhost 先解析到 ::1"
      # 猜出来的, 不该再猜第二次.
      - name: 失败时打印容器状态与探针日志
        if: failure()
        run: |
          docker compose ps
          for c in $(docker compose ps -aq); do
            echo "=== $c ==="
            docker inspect --format '{{.Name}} state={{.State.Status}} exit={{.State.ExitCode}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$c"
            if docker inspect --format '{{if .State.Health}}yes{{end}}' "$c" | grep -q yes; then
              docker inspect --format '{{range .State.Health.Log}}[exit {{.ExitCode}}] {{.Output}}{{end}}' "$c"
            fi
          done
          docker compose logs --no-color --tail 200

      # 一定要收尾: 残留的容器不影响 runner (用完即销毁), 但这条能让日志干净,
      # 也顺手证明 down 是可用的
      - name: 收尾
        if: always()
        run: docker compose down -v
