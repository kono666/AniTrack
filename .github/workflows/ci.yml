# ============================================================
#  CI —— 每次推送到 main / 每个 PR 都跑一遍
#
#  三个 job 各自回答一个不同的问题:
#    backend   —— 代码逻辑还对吗? (后端全部用例)
#    frontend  —— 组件还对吗? 前端还构建得出来吗?
#    image     —— 这东西真的能部署吗? (构建两个镜像 + 起真 compose 栈冒烟)
#
#  最后一个是有意加的. Dockerfile 和 docker-compose.yml 在写完之后是「看起来对」的状态:
#  本机没有 Docker, 谁也没法执行一次. 部署配置最大的特点就是「写错了不会报错,
#  只会在别人机器上炸」—— 所以这里用真实 PostgreSQL 把它跑起来.
#
#  冒烟请求**全部打 nginx**, 不直连后端 —— 因为部署之后本来就只有一个入口
#  (后端不对宿主机开端口), 所以「经 nginx 能用」才是那个唯一值得断言的东西.
#  顺带钉住的: 静态资源真的被打进镜像了、深层路由刷新不 404、actuator 白名单
#  只放行一个端点、迁移脚本在已经迁移过的库上重放安全且能补回被拿掉的约束、
#  每天那份备份真的产出了而且真的恢复得回来、以及 Agent 全链路
#  (工具调用 -> 番剧卡片 -> SSE 分帧 -> 额度扣减) 在 mock 模型下真的跑得通.
#
#  两个镜像还会各过一遍 Trivy. 它**只报告、不拦 CI**, 理由写在那两步上面.
#  一句话: 漏洞库每天都在变, 一个会拦的扫描器会让「镜像一行没动,
#  但所有人的 PR 全红」变成常态, 而那种红只会训练人去忽略它.
#
#  曾经写着「不跑 scripts/verify-agent.py」, 理由是「它要真实 LLM 额度」.
#  那句理由是错的: 脚本对应的 README 那一段自己就写着 LLM_PROVIDER=mock
#  「不产生任何费用」—— 同一件事在两处说法相反, 而且恰好是让 CI 少跑一段的那个说法
#  被写进了 CI. 现在按能免费跑的那一种落地: 下面 .env 里给了 mock.
#
#  刻意不做的事:
#   - 不做镜像推送 (没有镜像仓库; 这一版的目标只是「构建得出来 + 跑得起来」)
# ============================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 允许在 Actions 页面手动点一次, 排查问题时不用先编一个空提交
  workflow_dispatch:

# 只需要读代码. 显式写出来, 免得 fork 来的 PR 拿到超出所需的权限
permissions:
  contents: read

# 同一个分支连推几次时, 取消掉还在跑的旧一轮 —— 新提交的结论才有意义
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端 · 单元与集成测试
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: anime-tracker/backend
    steps:
      - uses: actions/checkout@v7

      - name: 装 JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          # 缓存 ~/.m2/repository. key 会跟着 pom.xml 的哈希走, 改依赖才会重下
          cache: maven

      # -B 关掉交互与 ANSI 进度条 (日志里不要塞控制字符), -ntp 关掉下载进度行
      - name: 跑测试
        run: mvn -B -ntp test

      # 测试挂了的时候, 光看控制台那几行不够 —— 完整报告留下来
      - name: 存测试报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: anime-tracker/backend/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: 前端 · 测试与构建
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: anime-tracker/frontend
    steps:
      - uses: actions/checkout@v7

      - name: 装 Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: anime-tracker/frontend/package-lock.json

      # 用 ci 而不是 install: 它严格按 package-lock.json 装, 锁文件与 package.json
      # 一旦对不上就直接失败. install 会「顺手把锁文件改了」, 那等于把 CI 变成
      # 又一个能产出提交的地方 —— CI 只该验证, 不该改文件
      - name: 装依赖
        run: npm ci

      # vitest run = 跑一遍就退出. 不写 run 的话默认进 watch 模式, 会在 CI 里一直挂着
      - name: 跑测试
        run: npm run test

      - name: 构建
        run: npm run build

      - name: 存构建产物
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: anime-tracker/frontend/dist/
          retention-days: 7

  image:
    name: 镜像 · 构建 + compose 冒烟
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # 测试先过再花时间构建镜像 —— 测试都红的时候没必要再等一次镜像构建
    needs: [backend]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      # 两阶段构建里最慢的是「下 Maven 依赖」那一层. 缓存交给 GitHub Actions 的
      # 缓存服务, 第二次之后的运行能省掉几分钟 —— 否则每次提交都要重下一遍依赖.
      - name: 构建后端镜像
        uses: docker/build-push-action@v7
        with:
          context: ./anime-tracker/backend
          # 本机构建默认不跑测试 —— 上面 backend job 已经跑过一次了, 没必要再来一遍.
          # 这里要证明的是「能打出可运行的镜像」.
          tags: anitrack-backend:latest
          # load: 把镜像留在本机 docker 里, 下一步的 compose 才有得用
          # (不 load 的话构建完只存在于 buildx 的缓存里, docker compose 看不到)
          load: true
          # scope 是给这个 job 里两个 buildx 构建分家用的: 它们共用同一个 gha 缓存
          # 后端, 不带 scope 时两边的层会写到同一个 key 下互相顶掉 ——
          # 症状不是报错, 只是"缓存好像没生效", 每次都要重下依赖.
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # 前端镜像里是「nginx + 现构建出来的 dist」, 构建它同时验证了两件事:
      # 前端在 Linux 上构建得出来(本机是 Windows, 原生依赖的平台差异只有这里能发现),
      # 以及 Dockerfile 里的两阶段拷贝没写错路径.
      - name: 构建前端镜像
        uses: docker/build-push-action@v7
        with:
          context: ./anime-tracker/frontend
          tags: anitrack-frontend:latest
          load: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # ---------- 镜像漏洞扫描 ----------
      #
      # 位置放在两个镜像都构建完之后: 它们都是 load: true, 镜像就在本机 docker 里,
      # 扫的正是「将要部署的那个东西」, 而不是某个近似物.
      #
      # 扫出来不止是基础镜像的洞. 后端镜像里装着 fat jar, 所以 Trivy 会连
      # BOOT-INF/lib 下那一堆 Java 依赖一起读 —— 也就是说它同时回答了
      # 「alpine 基础镜像干净吗」和「我们自己的依赖干净吗」. 这一条值得知道,
      # 否则很容易以为它只跟 FROM 那一行有关.
      #
      # **只报告, 不拦 CI** (exit-code: '0'). 两条理由, 都是刻意的:
      #
      #   1. 报出来的东西里有一大块来自 Spring Boot 3.2 这条已经停更的线
      #      (3.2.12 是这条线最后一个版本). 拦住的话, 它要求的是「换到 3.4 / 3.5 / 4.x
      #      哪一条」—— 那是一个该单独决定的项目级决定, 不该由一次依赖升级顺手定下.
      #      已实测: 3.4.13 + springdoc 2.8.17 下 423 个用例全过, 想升随时可以升.
      #   2. 漏洞库每天在变. 会拦的扫描器意味着: 某天有人发了一条 CVE, 这个镜像
      #      一行代码没动, 但所有人开着的 PR 全变红. 那种红和"你这次改错了"长得一样,
      #      于是它会变成一种需要被忽略的噪音 —— 那比不扫更糟.
      #
      # 注意 exit-code 管的是"扫出漏洞"这件事. 扫描器**自己**跑挂了(拉不到漏洞库之类)
      # 仍然会让这一步失败 —— 这是故意的: 那说明这个扫描已经不再提供信息,
      # 而"以为在扫、其实没扫"是这里唯一真正危险的状态.
      #
      # 想改成拦: 把 exit-code 写成 '1'. 要放宽就配合 severity / ignore-unfixed 调.
      #
      # ignore-unfixed 只报"上游已有补丁"的那些. 没补丁的报了也无从下手,
      # 只会把真能动手的那几条淹掉.
      - name: 扫镜像漏洞 · 后端 (Trivy, 只报告)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: anitrack-backend:latest
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: 'true'
          exit-code: '0'

      - name: 扫镜像漏洞 · 前端 (Trivy, 只报告)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: anitrack-frontend:latest
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: 'true'
          exit-code: '0'

      # 这两个值在本次运行里现生成.
      # 不在仓库里写死任何看起来像密钥的东西 —— 就算它只是给一次性的冒烟容器用,
      # 躺在仓库里的 JWT_SECRET=... 也一定会在某个时刻被人复制到别处.
      - name: 生成一次性凭据
        run: |
          {
            echo "CI_JWT_SECRET=$(openssl rand -hex 32)"
            echo "CI_ADMIN_PASSWORD=ci$(openssl rand -hex 6)"
          } >> "$GITHUB_ENV"

      # compose 会自动读同目录下的 .env, 所以部署时那一套变量在这里原样走一遍
      #
      # HTTP_PORT 写 8080 而不是留空用默认的 80, 是刻意的:
      # 这样"这个变量确实被 compose 读到了"本身也变成了被验证的一件事.
      # 如果 compose 里那行 mapping 哪天被改回硬编码的 80, 下面的 curl 会连不上,
      # 而不是"照样通过" —— 端口这类配置最怕的就是改了个不生效还没人知道.
      # LLM_PROVIDER=mock 是给下面那段 Agent 端到端用的.
      #
      # 不写的话它会落到 compose 里的默认值 openai-compat, 而 CI 没有 API Key ——
      # 后端照样起得来、上面那 9 节冒烟照样全过, 只有端到端会以「助手未配置」收场.
      # mock 是仓库自己支持的取值 (MockLlmClient), 输出带【Mock 模式】前缀,
      # 不会伪装成真回复, 也不产生任何费用.
      #
      # .env 里只写 KEY=value, 解释留在这一层: 那个文件是给 compose 吃的,
      # 而本机没有 Docker, 往里塞任何非赋值内容都没法在本地验一遍.
      - name: 生成 CI 用的 .env
        env:
          # 非密钥, 只是本次冒烟的管理员用户名
          CI_ADMIN_USERNAME: ciadmin
        run: |
          cat > .env <<EOF
          DB_NAME=anitrack
          DB_USER=anitrack
          DB_PASS=ci${CI_JWT_SECRET:0:12}
          JWT_SECRET=${CI_JWT_SECRET}
          ADMIN_USERNAME=${CI_ADMIN_USERNAME}
          ADMIN_PASSWORD=${CI_ADMIN_PASSWORD}
          ADMIN_EMAIL=ci@example.com
          HTTP_PORT=8080
          LLM_PROVIDER=mock
          EOF

      - name: 起 compose 栈并等它健康
        # --wait 会一直等到每个服务都 healthy 才返回, 比「up 完 sleep 30」可靠:
        # 后者在慢机器上就是随机失败, 在快机器上就是白等.
        # 等不到会直接返回非零 —— 这一步本身就证明了 Dockerfile 里那条 HEALTHCHECK 是对的.
        run: docker compose up -d --wait --wait-timeout 240

      # 往库里预置几条番剧, 让下面那段端到端**不依赖 api.bgm.tv**.
      #
      # 起因是 CI #81: 端到端那一步红了, 红的却不是脚本 —— 它 RESULT: PASS=54 FAIL=0,
      # 是脚本后面那条「卡片断言有没有空转」的守卫判的红. 原因是 mock 模型挑中的工具是
      # get_ranking, 而它先在本地库里找, 库是空的 (启动预加载器也要打 api.bgm.tv,
      # 同样没通), 于是工具返回空, 守卫判它空转.
      #
      # 守卫的本意是对的 —— 「别让一段什么都没验的 CI 变绿」. 错的是它把
      # **有没有东西可验**押在了一个外部服务上. 押在外网上的断言只有两种结局:
      # 某天毫无预兆地变红, 或者被人顺手放宽到永远为真. 种几条数据之后,
      # 「有没有行」由我们说了算: 真出现 0 行, 那就是工具链路坏了.
      #
      # 为什么是 25 条: mock 调 get_ranking 用的是默认 limit=10, 而 getRanking 是
      # 「本地不足 min(limit,20) 条才回源」. 25 > 20, 所以不管 limit 取多少,
      # 这一步之后它都不会再去打外网 —— 预置同时把这个外部依赖整个摘掉了.
      #
      # id 取 9xxxxxxx 区间: Bangumi 不会返回这个区间的 subject id, 所以这几行
      # 既不会被回源覆盖, 也不会和真数据混起来.
      # anime 表只有 id 与 title 两个 NOT NULL 列 (见 V1__init_schema.sql),
      # 其余字段留空不影响排序读取.
      #
      # 一处已知的、故意留着的不完美: 预加载器在启动时会先调一次 getRanking(30),
      # 那时库还是空的, 于是 rank_30 这个缓存键里存了一份空结果. 工具用的是
      # rank_10, 与它不同键, 所以对这一段没有影响 —— 但如果将来有人从
      # /api/bangumi/ranking?limit=30 去查, 拿到的会是那份空缓存.
      - name: 预置番剧数据 (让端到端的卡片断言离线可判)
        env:
          DB_NAME: anitrack
          DB_USER: anitrack
        run: |
          set -euo pipefail

          # 取一个标量. ON_ERROR_STOP 不能省: 不加的话 psql 出错也返回 0,
          # "查询炸了"和"查出来是空"在 CI 里长得一模一样.
          scalar() {
            docker compose exec -T postgres psql -U "$DB_USER" -d "$DB_NAME" \
              -v ON_ERROR_STOP=1 -tAq -c "$1" | tr -d '\r'
          }

          docker compose exec -T postgres psql -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 -q <<'SQL'
          INSERT INTO anime (id, title, title_cn, cover_url, rating, rating_count,
                             total_episodes, date, status, tags)
          SELECT 99000000 + g,
                 'CI Seeded Anime ' || g,
                 'CI 预置番剧 ' || g,
                 'https://example.invalid/ci-' || g || '.jpg',
                 ((100 - g)::numeric / 10)::numeric(3, 1),
                 1000 - g,
                 12,
                 '2020-01',
                 '完结',
                 'CI,预置'
            FROM generate_series(1, 25) AS g;

          -- 第二组: 边界形状. 上面那 25 行是"整齐"的 —— 全都有票、都有日期、全都没有
          -- 名次, 于是搬进 SQL 的那几条排序里, 分组 CASE 永远只走 ELSE 那一支:
          -- "有名次的排在前面"、"缺日期的排在最后"、"没票的垫底"这些分支在 PostgreSQL
          -- 上一次都没被执行过. 而单元测试跑在 H2 上, 那里全绿**推不出** PG 上也对 ——
          -- ORDER BY 里 NULL 排哪, 两个库的默认正好相反(见 AnimeQueries 类注释).
          --
          -- status 一律用 'ci-smoke': 真数据里不会有这个值, 于是
          -- /filter?status=ci-smoke 命中的**恰好**是这五行. 冒烟里那些"顺序等于某某"
          -- 的断言要的正是这个 —— 否则库里混着什么会让期望值变成猜的.
          --
          -- 故意让"有名次的两行"id 比"没名次的三行"**大**: 这样按名次排出来的序列
          -- 不是 id 升序, 于是那条断言顺带说明"真的排了", 而不是"照插入顺序返回".
          INSERT INTO anime (id, title, rating, rating_count, sort_rank,
                             date, season, status, tags)
          VALUES (99000031, 'CI No Rank No Date', 9.0,  500, NULL, NULL,         NULL,      'ci-smoke', 'CI-SMOKE'),
                 (99000032, 'CI No Rank No Vote', 9.9,  0,   NULL, '2019-10-01', '2019-10', 'ci-smoke', 'CI-SMOKE'),
                 (99000033, 'CI No Rank No Rate', NULL, 500, NULL, '2021-01-01', '2021-01', 'ci-smoke', 'CI-SMOKE'),
                 (99000034, 'CI Ranked One',      8.0,  500, 1,    '2019-04-01', '2019-04', 'ci-smoke', 'CI-SMOKE'),
                 (99000035, 'CI Ranked Two',      8.0,  500, 2,    '2019-07-01', '2019-07', 'ci-smoke', 'CI-SMOKE');

          -- 第三组: 同一部番挂在"同一个概念的三种写法"下 —— 这是 EXISTS 半连接存在的
          -- 唯一理由. 标签名会先经 TagTranslationUtil 展开(百合 → 百合 / Yuri /
          -- Girls Love), 三个名字解析成三个 tag id; 顶层 JOIN 会让下面这两部番各出现
          -- **三次**, total 虚高、翻页还会重叠. EXISTS 每部至多一行.
          -- 冒烟里那条"每部只出一行"钉的就是它, 而这条断言只在 PG 上跑得到.
          INSERT INTO tag (name) VALUES ('百合'), ('Yuri'), ('Girls Love')
            ON CONFLICT (name) DO NOTHING;
          INSERT INTO anime_tag (anime_id, tag_id)
          SELECT a.id, t.id
            FROM anime a
            JOIN tag t ON t.name IN ('百合', 'Yuri', 'Girls Love')
           WHERE a.id IN (99000034, 99000035);
          SQL

          # 种完自己数一遍. 不数的话, 万一某条 INSERT 静默没生效,
          # 失败会以「工具结果里没有番剧行」或者「命中 0 条」的样子出现在几步之后,
          # 指错方向. 三组各数各的, 这样报出来的错能直接指到是哪一组没进去.
          n=$(scalar "SELECT count(*) FROM anime WHERE id BETWEEN 99000001 AND 99000025")
          test "$n" = "25" || { echo "FAIL: 第一组只进了 $n 条 (期望 25)"; exit 1; }
          n=$(scalar "SELECT count(*) FROM anime WHERE status = 'ci-smoke'")
          test "$n" = "5" || { echo "FAIL: 第二组(边界形状)只进了 $n 条 (期望 5)"; exit 1; }
          n=$(scalar "SELECT count(*) FROM anime_tag WHERE anime_id IN (99000034, 99000035)")
          test "$n" = "6" || { echo "FAIL: 第三组关联只进了 $n 条 (期望 2 部 × 3 个写法 = 6)"; exit 1; }
          echo "ok: 预置 25 条常规 + 5 条边界形状 + 6 条标签关联"

      - name: 冒烟 (全部经 nginx)
        env:
          CI_ADMIN_USERNAME: ciadmin
          # 入口是 nginx. 注意这里没有"另一个地址"可打 —— 后端已经不对宿主机开端口了,
          # 所以这一整个步骤顺带就是"入口只有一个"的验证: 以前这里写的是直连后端的 8080.
          BASE: http://localhost:8080
          DB_NAME: anitrack
          DB_USER: anitrack
        run: |
          set -euo pipefail

          # 每个断言都打印一行, 失败时日志里能直接看出卡在哪一条
          assert_status() {
            local expect="$1" url="$2"
            local got
            got=$(curl -s -o /tmp/body -w '%{http_code}' "$url")
            if [ "$got" != "$expect" ]; then
              echo "FAIL: $url 期望 $expect, 实际 $got"
              cat /tmp/body; echo
              exit 1
            fi
            echo "ok: $url -> $got"
          }

          # 响应头断言. 只看有没有这个头, 不看值 —— 要钉的是
          # "这条配置还在生效", 而不是它的具体取值
          assert_header() {
            local url="$1" name="$2"
            if ! curl -sI "$url" | grep -qi "^${name}:"; then
              echo "FAIL: $url 的响应里没有 $name"
              curl -sI "$url"
              exit 1
            fi
            echo "ok: $url 带 $name"
          }

          echo "--- 1. 静态站真的被托管了 (首页 200, 且它引用的资源拿得到) ---"
          #
          # 这一条挡的是"容器起来了但 dist 是空的/是旧的": 那种情况下
          # compose 一样健康、探活一样 UP, 只有打开页面才白屏.
          assert_status 200 "$BASE/"
          grep -q '<div id="app"' /tmp/body || { echo "FAIL: 首页不是应用外壳"; cat /tmp/body; exit 1; }
          asset=$(grep -o '/assets/[A-Za-z0-9._-]*\.js' /tmp/body | head -1)
          test -n "$asset" || { echo "FAIL: 首页里没有引用任何 /assets/*.js"; cat /tmp/body; exit 1; }
          assert_status 200 "$BASE$asset"

          echo "--- 2. 缓存与安全响应头 (这两条都是 add_header 那个坑的哨兵) ---"
          #
          # nginx 的 add_header 不继承: 任何 location 里写一条, server 层那几条就全没了.
          # 所以这里既看"该长期缓存的带没带 max-age", 也看"三条安全头还在不在"——
          # 只查其中一个的话, 另一边的静默失效不会有任何提示.
          curl -sI "$BASE$asset" | grep -qi 'cache-control:.*max-age' \
            || { echo "FAIL: 带哈希的资源没有长缓存"; curl -sI "$BASE$asset"; exit 1; }
          echo "ok: $asset 带长缓存"
          curl -sI "$BASE/" | grep -qi 'cache-control:.*no-cache' \
            || { echo "FAIL: index.html 被缓存住了(会配出新旧资源)"; curl -sI "$BASE/"; exit 1; }
          echo "ok: index.html 不缓存"
          assert_header "$BASE/" X-Content-Type-Options
          assert_header "$BASE/" X-Frame-Options
          assert_header "$BASE/" Referrer-Policy

          echo "--- 3. 深层路由刷新不 404 (SPA 回退) ---"
          #
          # /profile 在服务器上并没有这个文件. 没有 try_files 回退的话,
          # 手输地址或刷新子页面就是 404 —— 而首页永远正常, 所以本地点一遍发现不了.
          assert_status 200 "$BASE/profile"
          grep -q '<div id="app"' /tmp/body || { echo "FAIL: /profile 没有回退到应用外壳"; cat /tmp/body; exit 1; }

          echo "--- 4. 整体探活 (免登录; 库连不上时聚合状态会是 DOWN) ---"
          assert_status 200 "$BASE/actuator/health"
          grep -q '"status":"UP"' /tmp/body || { echo "FAIL: health 不是 UP"; cat /tmp/body; exit 1; }

          echo "--- 5. actuator 白名单只放行一个端点 ---"
          assert_status 404 "$BASE/actuator/env"
          assert_status 404 "$BASE/actuator/beans"
          assert_status 404 "$BASE/actuator/health/liveness"
          # 上面那三个 404 是 nginx 挡的, 所以还证明不了后端自己也在挡.
          # 从容器内部直连后端问一次 —— 401 才说明是"两层都在挡".
          # (后端不对宿主机开端口, 这是唯一够得着它的方式; 也顺便演示了
          #  运维时要直连后端该怎么做, 见 docker-compose.yml 里那段注释.)
          direct=$(docker compose exec -T backend wget -qO- http://localhost:8080/actuator/env 2>&1 || true)
          case "$direct" in
            *401*) echo "ok: 容器内直连后端 /actuator/env -> 401" ;;
            *) echo "FAIL: 期望直连后端拿到 401, 实际: $direct"; exit 1 ;;
          esac

          echo "--- 6. 空库上由环境变量建出管理员, 且能登录 ---"
          code=$(curl -s -o /tmp/login -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"${CI_ADMIN_USERNAME}\",\"password\":\"${CI_ADMIN_PASSWORD}\"}" \
            "$BASE/api/user/login")
          test "$code" = "200" || { echo "FAIL: 管理员登录 $code"; cat /tmp/login; exit 1; }
          grep -q '"code":200' /tmp/login || { echo "FAIL: 登录响应体不对"; cat /tmp/login; exit 1; }
          echo "ok: 管理员登录 200"

          echo "--- 7. 迁移建出来的表能读 (证明结构不只是 validate 过得去) ---"
          assert_status 200 "$BASE/api/review/list?subjectId=1"

          echo "--- 8. 迁移脚本在已迁移的库上重放安全, 且能补回被拿掉的约束 ---"
          #
          # 这一条测的是别处都测不到的一支: 全新的库上 V2/V3 只跑一次,
          # 所以那两个「先判断再改」的匿名块里 "已经存在" 那一支从来没被执行过.
          # 而部署到真服务器时用的**恰恰是**那一支 —— 线上库是老的,
          # 约束可能早就被 Hibernate 用别的名字建出来了.
          psql_() {
            docker compose exec -T postgres psql -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 -tAq "$@"
          }
          replay() {  # 把仓库里那份迁移文件原样喂给 psql (不是另抄一份 SQL, 抄的那份会走偏)
            docker compose exec -T postgres psql -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 -q -f - \
              < "anime-tracker/backend/src/main/resources/db/migration/postgres/$1.sql"
          }
          # 唯一索引总数(不含主键). 不写死数字, 拿"重放前"当基准:
          # 重放只允许让它保持不变. 变多 = 重复加了一条同列约束(白白多一个索引),
          # 而这正是 V2 注释里说的那个坑.
          unique_idx_count() {
            psql_ -c "SELECT count(*) FROM pg_index i JOIN pg_class c ON c.oid = i.indrelid
                      WHERE i.indisunique AND NOT i.indisprimary
                        AND c.relname IN ('anime_tracking','review','episode_watched','user');"
          }

          before=$(unique_idx_count)
          echo "重放前唯一索引数: $before"
          # 注意 -v ON_ERROR_STOP=1 是必须的: 不加的话 psql 出错也返回 0,
          # 于是"脚本炸了"和"脚本跑通了"在 CI 里长得一模一样
          replay V2__align_legacy_schema
          replay V3__add_unique_constraints
          after=$(unique_idx_count)
          test "$after" = "$before" \
            || { echo "FAIL: 重放后唯一索引从 $before 变成 $after (重复添加了)"; exit 1; }
          echo "ok: 重放两次没有多出索引"

          # 把其中一条拿掉再放一次 —— 证明那几个匿名块不是"永远跳过".
          # (这个库是本次运行新建的一次性库, 后面 down -v 会整个删掉)
          psql_ -c "ALTER TABLE review DROP CONSTRAINT uk_review_user_subject;"
          dropped=$(unique_idx_count)
          test "$dropped" = "$((before - 1))" \
            || { echo "FAIL: 拿掉一条后应为 $((before - 1)), 实际 $dropped"; exit 1; }
          replay V3__add_unique_constraints
          restored=$(unique_idx_count)
          test "$restored" = "$before" \
            || { echo "FAIL: 重放没能把约束补回来(期望 $before, 实际 $restored)"; exit 1; }
          echo "ok: 被拿掉的唯一约束能重新补上"

          echo "--- 9. 备份: 有产出、是完整的、而且真的恢复得回来 ---"
          #
          # 备份是那种"平时没人看、只在最需要的那一刻被打开"的东西,
          # 所以这里查的不是"容器还在跑", 而是文件本身.
          dump=$(docker compose exec -T backup sh -c 'ls -1t /backup/anitrack-*.sql.gz | head -1' | tr -d '\r')
          test -n "$dump" || { echo "FAIL: 备份目录里没有 dump"; docker compose logs --no-color backup; exit 1; }
          echo "ok: 有备份 $dump"

          # 三条分开查, 因为失败原因不同, 报出来的话也不一样:
          #   不是 gzip        -> 文件本身坏了
          #   没有收尾标记     -> pg_dump 中途断了(截断的 dump 一样能解压, 光看大小看不出来)
          #   没有 CREATE TABLE -> 备份的是个空库
          docker compose exec -T backup sh -c "gzip -t '$dump'" \
            || { echo "FAIL: $dump 不是完整的 gzip"; exit 1; }
          docker compose exec -T backup sh -c "gzip -dc '$dump' | tail -n 5 | grep -q 'PostgreSQL database dump complete'" \
            || { echo "FAIL: $dump 缺少 pg_dump 的收尾标记(截断的)"; exit 1; }
          docker compose exec -T backup sh -c "gzip -dc '$dump' | grep -q 'CREATE TABLE'" \
            || { echo "FAIL: $dump 里没有建表语句"; exit 1; }
          echo "ok: 备份文件完整且不是空的"

          # 恢复演练: 把 dump 灌进一个临时库, 再和源库比对一张**有数据**的表的行数.
          # 前面三条只证明得了 pg_dump 跑完了, 证明不了 psql 能把它吃回去 ——
          # 而"从没恢复过的备份等于一份猜测"这句话, 只能靠这一步来反驳.
          psql_db() { docker compose exec -T postgres psql -U "$DB_USER" -d "$1" -tAq -c "$2"; }
          psql_db postgres 'DROP DATABASE IF EXISTS restore_check' >/dev/null
          psql_db postgres 'CREATE DATABASE restore_check' >/dev/null
          docker compose exec -T backup sh -c "gzip -dc '$dump'" \
            | docker compose exec -T postgres psql -U "$DB_USER" -d restore_check -v ON_ERROR_STOP=1 -q
          src=$(psql_db "$DB_NAME" 'SELECT count(*) FROM "user"')
          dst=$(psql_db restore_check 'SELECT count(*) FROM "user"')
          test "$src" = "$dst" && test "$src" != "0" \
            || { echo "FAIL: 恢复后 user 表 $dst 行 ≠ 源库 $src 行"; exit 1; }
          echo "ok: 恢复演练通过 (user 表 $dst 行, 与源库一致)"

          echo "--- 10. 读路径: 排序与筛选在 PostgreSQL 上真的跑得动, 而且排对了 ---"
          #
          # 这一节补的是单元测试补不到的洞. 那些测试跑在 H2 上, 而下面这几样
          # H2 与 PostgreSQL **不保证一致**:
          #   · ORDER BY 里 NULL 排哪 —— H2 当最小值, PG 当最大值, DESC 下正好相反
          #   · CASE 包住排序列
          #   · LIKE ... ESCAPE '!'
          #   · EXISTS 半连接
          # 所以 H2 上全绿推不出 PG 上也对. 而"推不出"的那部分一旦错了, 症状是
          # 首页"最近更新"打开一屏没有日期的番、翻页时相邻两页重叠 —— 都不是报错,
          # 只是结果不对, 在本地永远看不到. 所以断言打在**排好的结果**上.
          #
          # 数据是预置的第二、三组(见上一步), 靠 status='ci-smoke' 与真数据隔开,
          # 顺序与条数因此是确定的. 期望值是**手算**的, 不是把当前输出抄下来 ——
          # 抄下来就把"现在什么样"当成了"应该什么样", 只能抓住"变了", 抓不住"错了".
          #
          # 手算的口径(五行: 31 无名次无日期 9.0/500票, 32 无名次9.9分0票,
          # 33 无名次无评分500票, 34 名次1 8.0/500票 date 2019-04-01,
          # 35 名次2 8.0/500票 date 2019-07-01):
          #   按名次 -> 34 35 (有名次, 名次升序) 然后 31 32 33 (无名次, id 兜底)
          #   按日期 -> 33(2021-01) 32(2019-10) 35(2019-07) 34(2019-04) 31(无日期, 最后)
          #   按评分 -> 31 34 35 (有票的按加权分, 同等票数下 9.0 > 8.0) 然后 32 33
          #             —— 9.9 分 0 票的垫底, 正是加权要修的那件事

          # 从 ApiResponse 里取一段. $1 是 python 表达式, 根是 d —— 也就是响应
          # 里那个 "data" 字段(裸数组那类接口, 它本身就是一个 list).
          # 写成一行是因为这是一段 YAML 块标量里的多行字符串 —— 缩进稍微一动
          # python 就会 IndentationError, 而那种错的报错信息完全指不到 YAML 上.
          # 末尾的 || true 是给 set -e 看的: 取不到就让调用方拿着空串去比对,
          # 失败信息里会连原始 body 一起打出来, 比让 python 抛栈清楚.
          jq_() { python3 -c "import json,sys;d=json.load(sys.stdin)['data'];print($1)" 2>/dev/null || true; }

          # 顺序断言: 比对整条 id 序列
          expect_order() {  # <名字> <期望 id 序列> <url>
            local name="$1" expect="$2" url="$3" body got
            body=$(curl -s "$url")
            got=$(printf '%s' "$body" | jq_ '" ".join(str(i["id"]) for i in d["list"])')
            test "$got" = "$expect" \
              || { echo "FAIL: $name 的顺序不对"; echo "  期望: $expect"; echo "  实际: $got";
                   echo "$body"; exit 1; }
            echo "ok: $name -> $got"
          }

          # 条数断言: 用在只关心"命中了哪些行"的地方
          expect_total() {  # <名字> <期望条数> <url>
            local name="$1" expect="$2" url="$3" body total
            body=$(curl -s "$url")
            total=$(printf '%s' "$body" | jq_ 'd["total"]')
            test "$total" = "$expect" \
              || { echo "FAIL: $name 期望 $expect 条, 实际 '$total'"; echo "$body"; exit 1; }
            echo "ok: $name -> $total 条"
          }

          # 裸数组那一种(by-tag 的契约没变, 仍然是数组).
          # 断言的是"这两部都在, 而且每部只出现一次", 不是"恰好等于这两部":
          # 前者已经足以抓住顶层 JOIN 那个 bug(它会把每部重复三遍), 又不会因为
          # 将来库里多出一部真挂着"百合"的番而变红 —— 那与本条要验的事无关,
          # 用精确相等就会把无关的数据变动变成一次 CI 失败.
          expect_tagged_rows() {  # <tag> <必须出现的 id>...
            local tag="$1"; shift
            local body got rows uniq id
            body=$(curl -s -G --data-urlencode "tag=$tag" "$BASE/api/bangumi/by-tag")
            got=$(printf '%s' "$body" | jq_ '" ".join(str(i["id"]) for i in d)')
            rows=$(printf '%s' "$got" | wc -w)
            uniq=$(printf '%s' "$got" | tr ' ' '\n' | sort -u | grep -c . || true)
            test "$rows" = "$uniq" \
              || { echo "FAIL: by-tag 里同一部番出现了多次 (顶层 JOIN 的症状)"; \
                   echo "  实际: $got"; echo "$body"; exit 1; }
            for id in "$@"; do
              case " $got " in
                *" $id "*) ;;
                *) echo "FAIL: by-tag 的结果里没有 $id (EXISTS 没命中?)"; \
                   echo "  实际: $got"; echo "$body"; exit 1 ;;
              esac
            done
            echo "ok: by-tag 每部番只出一行, 且 $* 都在 -> $got"
          }

          FILTER="$BASE/api/bangumi/filter?status=ci-smoke&limit=50"

          expect_order "按名次排(有名次在前, 无名次按 id 兜底)" \
                       "99000034 99000035 99000031 99000032 99000033" "$FILTER&sort=rank"
          # 这一条是整节里最要紧的: 少了 ORDER BY 里那条 CASE, PG 会把 NULL 当最大值
          # 排到最前, 期望序列就变成 99000031 打头 —— 而 H2 上同一个断言照样是绿的.
          expect_order "按播出日排(缺日期的排最后)" \
                       "99000033 99000032 99000035 99000034 99000031" "$FILTER&sort=date"
          # 顺带证明 sort=rating 真的换了序: 它在工具描述里对外给了那么久, 以前却是个
          # 假选项(传 rating 掉进 rank 分支, 拿回来的和 sort=rank 一模一样).
          expect_order "按加权评分排(没票的垫底)" \
                       "99000031 99000034 99000035 99000032 99000033" "$FILTER&sort=rating"

          # 三个可选条件各自单独命中一次 —— :param IS NULL 那一套要**两边都走过**:
          # 上面三条一条筛选条件都没给(全走 IS NULL 那一支), 这三条则都给了值.
          expect_total "year=2019 (LIKE 前缀匹配)" 3 "$FILTER&year=2019"
          expect_total "season=2019-04 (精确相等)" 1 "$FILTER&season=2019-04"

          # 年份查的是前缀, 所以模式串里的 % 必须被转义. 转义一旦失效,
          # "20%" 会退化成"匹配所有 20 开头的", 这里就会命中 3 条而不是 0 ——
          # 也就是说这条断言对"转义有没有生效"是两向的, 不是单边的.
          # (URL 里的 %25 是 % 的转义, 与 SQL 侧的 ! 转义是两件事.)
          expect_total "year=20% (百分号不是通配符)" 0 "$FILTER&year=20%25"

          # 分页: 第 2 页是同一个序的第二段, 既不重也不漏
          expect_order "第二页(每页 3 条)接着第一页" \
                       "99000034 99000031" "$FILTER&sort=date&page=2&limit=3"

          # EXISTS 半连接: 一部番挂在"百合"的三种写法下, 只该出**一行**.
          # 顶层 JOIN 这里会给出 [99000035 99000034 99000035 99000034 ...] ——
          # 多出来的行会把 total 抬高、并让 LIMIT/OFFSET 去数重复行.
          # (tag 用 --data-urlencode 交给 curl 编码, 不手写 %E7%99%BE... 那种串:
          #  手写的百分号编码在有人改了标签名之后会静默失配.)
          expect_tagged_rows "百合" 99000034 99000035

          # filter-meta 走的是另一条 SQL(SUBSTRING 投影 + DISTINCT), 只断言
          # "2019 在里面", 不断言整份列表 —— 那份列表取决于库里真有什么数据.
          assert_status 200 "$BASE/api/bangumi/filter-meta"
          curl -s "$BASE/api/bangumi/filter-meta" | grep -q '"2019"' \
            || { echo "FAIL: filter-meta 的年份里没有 2019 (SUBSTRING 投影没生效?)"; exit 1; }
          echo "ok: filter-meta 里有 2019"

          # 两条不带筛选条件的公开读路径也走一遍. limit=200 就是 @Max(200) 那个上界,
          # 顺带证明它没被写成 400.
          assert_status 200 "$BASE/api/bangumi/ranking?sort=rank&limit=200"
          assert_status 200 "$BASE/api/bangumi/ranking?sort=date&limit=200"
          # 第一条必须有日期. 缺日期的行只要排到了最前, 这一条就红 ——
          # 这正是"PG 把 NULL 当最大值"那个分叉在真实接口上的样子.
          first_date=$(curl -s "$BASE/api/bangumi/ranking?sort=date&limit=200" \
                       | jq_ 'd[0]["date"]')
          test -n "$first_date" && test "$first_date" != "None" \
            || { echo "FAIL: 最近更新的第一条没有日期 —— 缺日期的行排到了最前面"; exit 1; }
          echo "ok: 最近更新的第一条有日期 ($first_date)"

          echo "全部冒烟通过"

      # Agent 全链路的端到端验证, 用 mock 模型, 不产生任何费用.
      #
      # 这一段的断言只有真跑起来才看得见: 普通用户拿不到管理员的工具、
      # 越权访问回 403、SSE 真的按事件名分帧推、工具结果里的番剧行真的带了
      # 可直接渲染的卡片、额度按实际轮数扣. 这些逻辑写错了不会在单元测试里露头 ——
      # 它们坏掉的样子是「演示当天前端一片空白」.
      #
      # 打的是 nginx 的 8080, 和真人用同一个入口. SSE 能过 nginx 是因为
      # nginx.conf 的 location /api/ 里关了 proxy_buffering —— 不关的话
      # 流式响应会被攒到最后一次性吐出来, 这一段会挂在一个和代码无关的地方.
      - name: 端到端 (Agent 全链路, mock 模型)
        env:
          CI_ADMIN_USERNAME: ciadmin
          AGENT_BASE: http://localhost:8080
          AGENT_ADMIN_USER: ciadmin
          # postgres profile 下 BootstrapProperties.demoUserEnabled=false,
          # 所以 test/test123 那个 demo 用户**不存在** —— 下面现场注册一个.
          AGENT_USER_USER: citest
          # 不能沿用 test123: PasswordPolicy 要求至少 8 位且同时含字母和数字,
          # "test123" 只有 7 位, 连注册都过不去 (dev 里那个 demo 用户是引导代码
          # 直接建的, 没走参数校验, 所以它能存在 —— 这个差别正好在这里露出来).
          AGENT_USER_PASS: citest12345
        run: |
          set -euo pipefail

          # 管理员密码本次运行现生成, 从环境里取, 不落进仓库
          export AGENT_ADMIN_PASS="$CI_ADMIN_PASSWORD"

          echo "--- 先注册一个普通用户 (CI 里没有 demo 用户) ---"
          code=$(curl -s -o /tmp/reg -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"$AGENT_USER_USER\",\"email\":\"citest@example.com\",\"password\":\"$AGENT_USER_PASS\"}" \
            "$AGENT_BASE/api/user/register")
          test "$code" = "200" || { echo "FAIL: 注册普通用户 -> $code"; cat /tmp/reg; exit 1; }
          echo "ok: 普通用户 $AGENT_USER_USER 注册成功"

          echo "--- 跑 scripts/verify-agent.py ---"
          # pipefail 上面已开, 所以脚本的非零退出码能穿过 tee 传出来
          python3 anime-tracker/scripts/verify-agent.py 2>&1 | tee /tmp/agent.log

          # 额外钉一条脚本自己钉不了的.
          #
          # 脚本要能在任意 provider 下跑, 所以「mock 到底调没调到工具」不能写死在它里面;
          # 但 CI 知道自己给的是 mock, 可以在这里查.
          #
          # 为什么非查不可: 脚本里那几十条卡片断言都是
          # 「**如果**有带 type=anime 标记的行, 就必须带卡片」的形式. 工具返回空的时候,
          # 那些断言会**全部空转通过** —— RESULT 照样 FAIL=0, 退出码照样 0,
          # 而卡片那条链路压根没被检查过. 一个绿色的、但什么都没验的 CI, 比一个红色的更糟.
          #
          # 这句「至少得有一行」是有底气的, 不再是碰运气: 上面「预置番剧数据」那一步
          # 已经往库里种了 25 条, 而 mock 挑中的 get_ranking 是先在本地库找、够数就不打外网.
          # 所以这一条现在是**离线**的 —— 真出现 0 行, 不再是"api.bgm.tv 不通",
          # 而是工具结果到卡片这条链路真的断了.
          #
          # (CI #81 之前这里写的是「多半是 api.bgm.tv 不通或被限流 —— 不是代码的问题」,
          #  那句话等于承认这条断言会随机变红. 现在它不该再红得无缘无故.)
          tagged=$(grep -o 'carrying tagged anime rows=[0-9]*' /tmp/agent.log \
                   | grep -o '[0-9]*$' | tail -1 || true)
          test -n "$tagged" \
            || { echo "FAIL: 日志里找不到 'carrying tagged anime rows' 这一行"; exit 1; }
          test "$tagged" -ge 1 \
            || { echo "FAIL: 工具结果里没有带 type=anime 的行 (=$tagged), 卡片断言全部空转了."
                 echo "      库里有预置数据, get_ranking 不该返回空 —— 查工具结果的组装与 ToolCards."
                 exit 1; }
          echo "ok: mock 真的调到了工具, 结果带 $tagged 组番剧行 (卡片断言不是空转)"

      # 失败了才有必要看日志 —— 平时打出来只会把有效信息淹掉.
      #
      # 除了应用日志, 还要把 **探针自己的输出**打出来.
      # 起因是 CI #22: nginx 起来了、配置也解析了, 但被判 unhealthy,
      # 而 docker compose logs 里一行相关的话都没有 —— 探针失败的原因不在容器
      # 的 stdout 里, 在它的 health log 里. 那次是从"localhost 先解析到 ::1"
      # 猜出来的, 不该再猜第二次.
      - name: 失败时打印容器状态与探针日志
        if: failure()
        run: |
          docker compose ps
          for c in $(docker compose ps -aq); do
            echo "=== $c ==="
            docker inspect --format '{{.Name}} state={{.State.Status}} exit={{.State.ExitCode}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$c"
            if docker inspect --format '{{if .State.Health}}yes{{end}}' "$c" | grep -q yes; then
              docker inspect --format '{{range .State.Health.Log}}[exit {{.ExitCode}}] {{.Output}}{{end}}' "$c"
            fi
          done
          docker compose logs --no-color --tail 200

      # 一定要收尾: 残留的容器不影响 runner (用完即销毁), 但这条能让日志干净,
      # 也顺手证明 down 是可用的
      - name: 收尾
        if: always()
        run: docker compose down -v
